<style>
/* Fonts are self-hosted. */
@font-face { font-family: "Hanken Grotesk"; src: url("fonts/hanken-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

/* Layout: one calm column, wall-calendar details (tear-off sheet, condensed day numerals, highlighter on the winning day). */
:root {
  --paper: #F2F3EE;
  --card: #FBFBF8;
  --ink: #17201C;
  --ink-2: #57615C;
  --ink-3: #8A938E;
  --line: #D9DCD3;
  --cobalt: #2445C9;
  --cobalt-soft: #E2E7FA;
  --on-cobalt: #FFFFFF;
  --amber: #D99A12;
  --amber-soft: #FBF0D4;
  --marker: #FFE35A;
  --marker-ink: #1C1A0C;
  --hl: #FFE35A;
  --danger: #B3261E;
  --ok: #1E7A4C;
  --shadow: 0 1px 0 rgba(23, 32, 28, .04), 0 6px 18px -10px rgba(23, 32, 28, .18);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111513; --card: #191E1B; --ink: #E5EAE6; --ink-2: #A2ABA6; --ink-3: #6E7772; --line: #2B322E;
    --cobalt: #8EA3FF; --cobalt-soft: #1F2848; --on-cobalt: #0D1430; --amber: #E6B13F; --amber-soft: #3A2F14;
    --marker: #D8BC2C; --marker-ink: #17150A; --hl: rgba(216, 188, 44, .34); --danger: #F2867E; --ok: #6FD1A0;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111513; --card: #191E1B; --ink: #E5EAE6; --ink-2: #A2ABA6; --ink-3: #6E7772; --line: #2B322E;
  --cobalt: #8EA3FF; --cobalt-soft: #1F2848; --on-cobalt: #0D1430; --amber: #E6B13F; --amber-soft: #3A2F14;
  --marker: #D8BC2C; --marker-ink: #17150A; --hl: rgba(216, 188, 44, .34); --danger: #F2867E; --ok: #6FD1A0;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; color-scheme: light; background: var(--paper); }
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
body {
  margin: 0;
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
.foot { display: grid; gap: 10px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 16px; }
.foot .row { gap: 6px 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--cobalt); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: .01em; overflow-wrap: anywhere; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.sheet-mini { width: 30px; height: 32px; border-radius: 5px; background: var(--card); border: 1.5px solid var(--ink); overflow: hidden; display: grid; grid-template-rows: 9px 1fr; }
.sheet-mini::before { content: ""; background: var(--cobalt); }
.sheet-mini span { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1; display: grid; place-items: center; }
.brand b { font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.top .spacer { flex: 1; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--on-cobalt); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; padding: 0 10px; }
.btn.ghost:hover { background: var(--cobalt-soft); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.back { background: none; border: 0; padding: 4px 0; color: var(--ink-2); font-weight: 600; cursor: pointer; justify-self: start; text-decoration: none; }
.back:hover { color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 14px; min-width: 0; }
.card.focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-soft), var(--shadow); }
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); font-size: 14px; }
.banner a { color: inherit; font-weight: 700; }

/* list */
.list-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.events { display: grid; gap: 10px; }
.ev { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; text-decoration: none; color: inherit; }
.ev:hover { border-color: var(--ink-3); }
.ev .t { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.ev .m { font-size: 13px; color: var(--ink-2); }
.ev .go { color: var(--ink-3); font-size: 20px; }
.chip-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--cobalt-soft); color: var(--cobalt); vertical-align: 2px; margin-left: 6px; }
.chip-tag.amber { background: var(--amber-soft); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.gicon { width: 52px; height: 52px; border-radius: 12px; background: var(--cobalt-soft); color: var(--cobalt); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 22px; flex: none; }

/* people */
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
button.pchip { cursor: pointer; min-height: 34px; }
button.pchip:hover { border-color: var(--cobalt); }
.pchip.me, button.pchip[aria-pressed="true"] { border-color: var(--cobalt); box-shadow: 0 0 0 1px var(--cobalt); }
.av { width: 32px; height: 32px; border-radius: 999px; background: var(--cobalt-soft); color: var(--cobalt); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; flex: none; line-height: 1; }
.av.noapp { background: transparent; border: 1.5px dashed var(--line); color: var(--ink-3); }
.pchip .av { width: 24px; height: 24px; font-size: 12px; }
.mrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }
.mlist > * + * { border-top: 1px solid var(--line); }
.mrow .m { display: block; font-size: 13px; color: var(--ink-2); }
.mrow b { overflow-wrap: anywhere; }
.linkbox { margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; user-select: all; -webkit-user-select: all; }
.inrow { display: flex; gap: 8px; }
.inrow .input { flex: 1; min-width: 0; }

/* tear-off sheet */
.sheet { width: 64px; flex: none; border-radius: 8px; overflow: hidden; background: var(--card); border: 1.5px solid var(--ink); text-align: center; line-height: 1; }
.sheet .mo { background: var(--cobalt); color: var(--on-cobalt); font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 0 3px; }
.sheet .dn { font-family: var(--f-display); font-weight: 700; font-size: 32px; padding: 5px 0 2px; font-variant-numeric: tabular-nums; }
.sheet .wd { font-size: 11px; font-weight: 600; color: var(--ink-2); padding-bottom: 6px; }
.sheet.big { width: 104px; }
.sheet.big .mo { font-size: 15px; padding: 6px 0 5px; }
.sheet.big .dn { font-size: 56px; padding: 8px 0 2px; }
.sheet.big .wd { font-size: 13px; padding-bottom: 10px; }
.sheet.empty .mo { background: var(--line); color: var(--ink-2); }
.sheet.empty .dn { color: var(--ink-3); }

.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.how .step { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.how .num { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1; color: var(--cobalt); }
.how p { font-size: 14px; color: var(--ink-2); }
.how b { color: var(--ink); display: block; }

/* form */
label.lbl { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--paper); }
.input:focus { border-color: var(--cobalt); outline: none; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; }

/* shared calendar: your own days solid, other people's days tinted with a count */
.cal { display: grid; gap: 10px; max-width: 440px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head b { font-family: var(--f-display); font-size: 22px; font-weight: 700; text-transform: capitalize; }
.cal-nav { width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; }
.cal-nav[disabled] { opacity: .35; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.day { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 9px; border: 1.5px solid transparent; background: var(--paper); cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.day:hover:not([disabled]) { border-color: var(--cobalt); }
.day.we { color: var(--ink-2); }
.day.today { border-color: var(--ink); }
.day[disabled] { opacity: .3; cursor: default; }
.day.others { background: var(--cobalt-soft); color: var(--ink); }
.day.yes { background: var(--cobalt); color: var(--on-cobalt); }
.day.maybe { background: repeating-linear-gradient(135deg, var(--amber-soft) 0 4px, var(--card) 4px 8px); border-color: var(--amber); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.day.best::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 4px; height: 4px; border-radius: 2px; background: var(--marker); }
.day.chosen { box-shadow: 0 0 0 3px var(--marker); }
.day .badge { position: absolute; top: 2px; right: 4px; font-family: var(--f-body); font-size: 10px; font-weight: 700; line-height: 1.3; opacity: .9; }
.day.others .badge { color: var(--cobalt); opacity: 1; }
.blank { aspect-ratio: 1; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
.mydays { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.mydays b { color: var(--ink); }

/* event view */
.ev-head { display: grid; gap: 6px; }
.ev-head .meta { color: var(--ink-2); font-size: 14px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); width: fit-content; max-width: 100%; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tab .cnt { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }

/* best day */
.best { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.best .txt { display: grid; gap: 6px; min-width: 0; flex: 1 1 220px; }
.best .big { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.05; }
.hl { background: linear-gradient(transparent 48%, var(--hl) 48%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 2px; }

/* ranking */
.rank { display: grid; gap: 2px; }
.rank-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 10px; }
.rank-row + .rank-row { border-top: 1px solid var(--line); }
.rank-row.top { background: color-mix(in srgb, var(--hl) 40%, transparent); }
.rank-row .dl { font-weight: 600; white-space: nowrap; }
.rank-row .dl .dnum { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0 2px; }
.bar { height: 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar .y { background: var(--cobalt); }
.bar .m { background: repeating-linear-gradient(135deg, var(--amber) 0 3px, transparent 3px 6px); }
.who { font-size: 13px; color: var(--ink-2); margin-top: 4px; overflow-wrap: anywhere; }
.who .mb { color: color-mix(in srgb, var(--amber) 65%, var(--ink)); }
.score { font-family: var(--f-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.score small { font-size: 15px; color: var(--ink-3); font-weight: 600; }
.score .q { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 600; color: color-mix(in srgb, var(--amber) 70%, var(--ink)); margin-top: 3px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }
.legend i.y { background: var(--cobalt); border-color: var(--cobalt); }
.legend i.m { background: repeating-linear-gradient(135deg, var(--amber) 0 2px, transparent 2px 4px); border-color: var(--amber); }
.legend i.o { background: var(--cobalt-soft); border-color: var(--cobalt-soft); }
.legend i.b { background: var(--marker); border-color: var(--marker); height: 4px; vertical-align: 3px; }

/* matrix */
.tablewrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.grid { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 14px; }
table.grid th, table.grid td { padding: 4px; text-align: center; }
table.grid thead th { font-weight: 600; font-size: 12px; color: var(--ink-2); vertical-align: bottom; white-space: nowrap; }
table.grid thead th .n { display: block; font-family: var(--f-display); font-size: 17px; font-weight: 700; color: var(--ink); }
table.grid th.name { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; min-width: 110px; padding-right: 10px; font-weight: 600; white-space: nowrap; }
table.grid tbody th.name .chip-tag { margin-left: 4px; }
table.grid tbody tr.me th.name { color: var(--cobalt); }
table.grid tbody tr + tr td, table.grid tbody tr + tr th { border-top: 1px solid var(--line); }
table.grid tfoot td, table.grid tfoot th { border-top: 1.5px solid var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; padding-top: 8px; }
table.grid tfoot th { font-family: var(--f-body); font-size: 13px; text-align: left; }
.noapp-tag { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
.cell { width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; font-size: 15px; display: inline-grid; place-items: center; color: var(--ink-3); }
.cell.yes { background: var(--cobalt); border-color: var(--cobalt); color: var(--on-cobalt); }
.cell.maybe { background: repeating-linear-gradient(135deg, var(--amber-soft) 0 4px, transparent 4px 8px); border-color: var(--amber); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.cell[disabled] { cursor: default; }
.x { width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 18px; }
.x:hover { background: var(--paper); color: var(--danger); }
th.top-col { background: color-mix(in srgb, var(--hl) 50%, transparent); border-radius: 8px 8px 0 0; }

/* messages */
.msg { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 12px 14px; max-width: 460px; }
.msg-card { display: grid; gap: 12px; }

.empty { text-align: center; padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.empty p { max-width: 46ch; color: var(--ink-2); }

.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); z-index: 20; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
#toast[hidden] { display: none; }

.skeleton { height: 64px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }

@media (max-width: 560px) {
  h1 { font-size: 30px; }
  .rank-row { grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; }
  .rank-row .dl { font-size: 13px; }
  .rank-row .dl .dnum { font-size: 19px; }
  .card { padding: 14px; }
  .sheet.big { width: 88px; }
  .sheet.big .dn { font-size: 46px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="wrap" id="app"><noscript><p>Deze pagina heeft JavaScript nodig. Zet JavaScript aan in je browser.</p></noscript></main>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script>
/* ---------- dates ---------- */
const WD = ['zo','ma','di','wo','do','vr','za'];
const WDL = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MO = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MOL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const pad = n => String(n).padStart(2, '0');
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function iso(dt) { return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
function todayIso() { return iso(new Date()); }
function monthStart(dt) { return new Date(dt.getFullYear(), dt.getMonth(), 1); }
function yearSuffix(t) { return t.getFullYear() !== new Date().getFullYear() ? ' ' + t.getFullYear() : ''; }
function shortDate(s) { const t = pd(s); return WD[t.getDay()] + ' ' + t.getDate() + ' ' + MO[t.getMonth()] + yearSuffix(t); }
function longDate(s) { const t = pd(s); return WDL[t.getDay()] + ' ' + t.getDate() + ' ' + MOL[t.getMonth()] + yearSuffix(t); }

function cleanName(n) {
  return String(n).replace(/[‎‏‪-‮⁦-⁩]/g, '').replace(/^~\s*/, '').replace(/\s+/g, ' ').trim();
}
function nameKey(n) { return cleanName(n).toLowerCase(); }
</script>
<script>
(function () {
  'use strict';
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const B62 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  // Random ids. The invite code is the secret part of an invitation link.
  function rid(n) {
    const a = new Uint8Array(n * 2); crypto.getRandomValues(a);
    let s = '';
    for (const x of a) { if (x < 248) s += B62[x % 62]; if (s.length === n) break; }
    return s.length === n ? s : s + rid(n - s.length);
  }

  /* ---------- config ---------- */
  const CFG = window.WKW_CONFIG || {};
  const configured = !!(CFG.firebase && CFG.firebase.apiKey && CFG.firebase.projectId && !/VUL/i.test(CFG.firebase.apiKey));
  const DEMO = 'voorbeeld';
  const DEL = { del: true }; // patch value: remove this field

  const S = {
    route: null, g: null, mine: {}, offline: navigator.onLine === false, error: '',
    tab: 'overview', sortMode: 'best', allDays: false, confirm: null, calMonth: null,
    draft: null, draftErr: '', proxy: { pid: null, name: '', err: '' },
    ng: null, join: null, who: null, set: null, pendingName: null,
  };

  /* ---------- small things this device remembers ---------- */
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const K_GROUPS = 'wiekanwanneer-groepen', K_NAME = 'wiekanwanneer-naam';
  S.mine = LS.get(K_GROUPS, {});
  if (!S.mine || typeof S.mine !== 'object') S.mine = {};
  function remember(gid, name) {
    if (gid === DEMO) return;
    const o = S.mine[gid];
    if (o && o.name === name) return;
    S.mine[gid] = { name, seen: o ? o.seen : Date.now() }; LS.set(K_GROUPS, S.mine);
  }
  function forget(gid) { if (S.mine[gid]) { delete S.mine[gid]; LS.set(K_GROUPS, S.mine); } }
  function savedName() { const n = LS.get(K_NAME, ''); return typeof n === 'string' ? n : ''; }
  function keepStorage() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} }

  /* ---------- Firebase: anonymous account per device, Firestore for the shared data ---------- */
  const FB_URL = 'https://www.gstatic.com/firebasejs/12.19.0/';
  let fb = null, fbInit = null, fbSign = null;
  function firebase() {
    if (fb) return Promise.resolve(fb);
    if (!fbInit) {
      fbInit = Promise.all(['app', 'auth', 'firestore'].map(m => import(FB_URL + 'firebase-' + m + '.js'))).then(([A, Au, F]) => {
        const fapp = A.initializeApp(CFG.firebase);
        const auth = Au.getAuth(fapp);
        let db;
        try { db = F.initializeFirestore(fapp, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
        catch (e) { db = F.getFirestore(fapp); }
        if (CFG.emulator) {
          Au.connectAuthEmulator(auth, CFG.emulator.auth, { disableWarnings: true });
          F.connectFirestoreEmulator(db, CFG.emulator.host, CFG.emulator.port);
        }
        return { Au, F, auth, db };
      });
      fbInit.catch(() => { fbInit = null; });
    }
    if (!fbSign) {
      fbSign = fbInit.then(async x => {
        await x.auth.authStateReady();
        if (!x.auth.currentUser) await x.Au.signInAnonymously(x.auth);
        fb = Object.assign({ uid: x.auth.currentUser.uid }, x);
        if (S.error) { S.error = ''; scheduleRender(); }
        return fb;
      });
      fbSign.catch(() => { fbSign = null; });
    }
    return fbSign;
  }

  // Patches use dotted keys ("answers.p123") so two people writing at once never overwrite each other.
  const Remote = {
    groupRef: gid => fb.F.doc(fb.db, 'groups', gid),
    memberRef: gid => fb.F.doc(fb.db, 'groups', gid, 'members', fb.uid),
    eventRef: (gid, eid) => fb.F.doc(fb.db, 'groups', gid, 'events', eid),
    patch(p) { const out = {}; for (const k of Object.keys(p)) out[k] = p[k] === DEL ? fb.F.deleteField() : p[k]; return out; },
    watch(gid, h) {
      const { F, db } = fb;
      // A missing document read from the local cache only means "not known yet".
      const one = s => s.exists() ? s.data() : s.metadata.fromCache ? undefined : null;
      const u = [
        F.onSnapshot(Remote.memberRef(gid), s => h.member(one(s)), h.error),
        F.onSnapshot(Remote.groupRef(gid), s => h.group(one(s)), h.error),
        F.onSnapshot(F.collection(db, 'groups', gid, 'events'), qs => { const m = {}; qs.forEach(d => { m[d.id] = d.data(); }); h.events(m); }, h.error),
      ];
      return () => u.forEach(f => f());
    },
    createGroup(gid, group, member) {
      const b = fb.F.writeBatch(fb.db);
      b.set(Remote.groupRef(gid), group); b.set(Remote.memberRef(gid), member);
      return b.commit();
    },
    getMember: gid => fb.F.getDoc(Remote.memberRef(gid)).then(s => s.exists() ? s.data() : null),
    join: (gid, member) => fb.F.setDoc(Remote.memberRef(gid), member),
    updateMember: (gid, p) => fb.F.updateDoc(Remote.memberRef(gid), Remote.patch(p)),
    updateGroup: (gid, p) => fb.F.updateDoc(Remote.groupRef(gid), Remote.patch(p)),
    createEvent: (gid, eid, d) => fb.F.setDoc(Remote.eventRef(gid, eid), d),
    updateEvent: (gid, eid, p) => fb.F.updateDoc(Remote.eventRef(gid, eid), Remote.patch(p)),
    deleteEvent: (gid, eid) => fb.F.deleteDoc(Remote.eventRef(gid, eid)),
    async removePerson(gid, pid) {
      const { F, db } = fb;
      const s = await F.getDocs(F.query(F.collection(db, 'groups', gid, 'members'), F.where('pid', '==', pid)));
      const b = F.writeBatch(db);
      s.forEach(d => { if (d.id !== fb.uid) b.delete(d.ref); });
      b.update(Remote.groupRef(gid), { ['people.' + pid]: F.deleteField(), updatedAt: Date.now() });
      return b.commit();
    },
    leave: gid => fb.F.deleteDoc(Remote.memberRef(gid)),
    async deleteGroup(gid) {
      const { F, db } = fb;
      const [evs, mem] = await Promise.all([F.getDocs(F.collection(db, 'groups', gid, 'events')), F.getDocs(F.collection(db, 'groups', gid, 'members'))]);
      const b = F.writeBatch(db);
      evs.forEach(d => b.delete(d.ref));
      mem.forEach(d => { if (d.id !== fb.uid) b.delete(d.ref); });
      b.delete(Remote.groupRef(gid));
      b.delete(Remote.memberRef(gid));
      return b.commit();
    },
  };

  /* ---------- example group: lives in memory only ---------- */
  const Demo = {
    d: null, h: null,
    seed() {
      const base = new Date(); base.setHours(0, 0, 0, 0);
      const fri = new Date(base);
      fri.setDate(base.getDate() + ((5 - base.getDay() + 7) % 7));
      if ((fri - base) / 864e5 < 3) fri.setDate(fri.getDate() + 7);
      const day = k => { const x = new Date(fri); x.setDate(fri.getDate() + k); return iso(x); };
      const now = Date.now();
      const names = { me: 'Jij', p1: 'Jan', p2: 'Els', p3: 'Tom', p4: 'Sofie', p5: 'Pieter' };
      const people = {};
      Object.keys(names).forEach((k, i) => { people[k] = { name: names[k], app: k !== 'p4', at: now - (10 - i) * 1000 }; });
      const ans = (yes, maybe) => ({ yes, maybe: maybe || [], none: false, at: now });
      this.d = {
        member: { pid: 'me' },
        group: { name: 'Voorbeeld: de vrienden', invite: DEMO, ownerPid: 'me', people, createdAt: now, updatedAt: now },
        events: {
          e1: { title: 'Etentje', chosen: null, createdBy: 'p1', createdAt: now, updatedAt: now, sharedAt: now,
            answers: {
              p1: ans([day(0), day(1), day(8), day(14)]),
              p2: ans([day(1), day(8), day(9)], [day(0)]),
              p3: ans([day(1), day(7), day(8)]),
              p4: ans([day(8)], [day(1)]),
            } },
          e2: { title: 'Fietstocht naar zee', chosen: day(15), createdBy: 'me', createdAt: now - 1, updatedAt: now, sharedAt: now,
            answers: { me: ans([day(15), day(16)]), p1: ans([day(15)]), p2: ans([day(15), day(22)]), p3: ans([day(16)], [day(15)]), p5: ans([day(15), day(16), day(22)]) } },
        },
      };
    },
    watch(gid, h) {
      if (!this.d) this.seed();
      this.h = h;
      Promise.resolve().then(() => this.emit());
      return () => { if (this.h === h) this.h = null; };
    },
    emit() { const h = this.h, d = this.d; if (!h || !d) return; h.member(clone(d.member)); h.group(clone(d.group)); h.events(clone(d.events)); },
    put(obj, p) {
      for (const k of Object.keys(p)) {
        const path = k.split('.'), last = path.pop();
        let o = obj;
        for (const seg of path) o = o[seg] = o[seg] || {};
        if (p[k] === DEL) delete o[last]; else o[last] = clone(p[k]);
      }
    },
    done() { this.emit(); return Promise.resolve(); },
    updateGroup(gid, p) { this.put(this.d.group, p); return this.done(); },
    updateMember(gid, p) { this.put(this.d.member, p); return this.done(); },
    createEvent(gid, eid, data) { this.d.events[eid] = clone(data); return this.done(); },
    updateEvent(gid, eid, p) { if (this.d.events[eid]) this.put(this.d.events[eid], p); return this.done(); },
    deleteEvent(gid, eid) { delete this.d.events[eid]; return this.done(); },
    removePerson(gid, pid) { delete this.d.group.people[pid]; return this.done(); },
    leave() { this.d = null; return Promise.resolve(); },
    deleteGroup() { this.d = null; return Promise.resolve(); },
  };
  const api = gid => gid === DEMO ? Demo : Remote;

  /* ---------- the open group: live data from the listeners ---------- */
  function openGroup(gid) {
    if (S.g && S.g.gid === gid) return;
    closeGroup();
    const g = S.g = { gid, group: null, events: {}, member: undefined, gotGroup: false, gotEvents: false, error: null, unsub: null };
    if (S.mine[gid]) { S.mine[gid].seen = Date.now(); LS.set(K_GROUPS, S.mine); }
    const live = () => S.g === g;
    const start = () => {
      if (!live()) return;
      g.unsub = api(gid).watch(gid, {
        member: d => { if (!live() || d === undefined) return; g.member = d; if (d === null) forget(gid); changed(); },
        group: d => { if (!live() || d === undefined) return; g.group = d; g.gotGroup = true; if (d) remember(gid, d.name); else forget(gid); changed(); },
        events: m => {
          if (!live()) return;
          const out = {};
          for (const id of Object.keys(m)) out[id] = normEvent(id, m[id]);
          g.events = out; g.gotEvents = true; changed();
        },
        error: e => { if (!live()) return; g.error = e; if (e && e.code === 'permission-denied') forget(gid); changed(); },
      });
    };
    if (gid === DEMO) start();
    else if (configured) firebase().then(start, e => { if (live()) { g.error = e; changed(); } });
  }
  function closeGroup() { if (S.g && S.g.unsub) S.g.unsub(); S.g = null; }
  function changed() { autoClaim(); scheduleRender(); }

  // Answers are plain lists of ISO dates; "none" means "I checked and no day works".
  function normEvent(id, d) {
    d = d || {};
    const arr = v => Array.isArray(v) ? v.filter(x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x)) : [];
    const answers = {};
    if (d.answers && typeof d.answers === 'object') {
      for (const k of Object.keys(d.answers)) {
        const a = d.answers[k] || {}, yes = arr(a.yes);
        answers[k] = { yes, maybe: arr(a.maybe).filter(x => !yes.includes(x)), none: !!a.none, at: +a.at || 0 };
      }
    }
    return {
      id, title: typeof d.title === 'string' ? d.title : '',
      chosen: typeof d.chosen === 'string' ? d.chosen : null,
      createdBy: typeof d.createdBy === 'string' ? d.createdBy : '',
      createdAt: +d.createdAt || 0, updatedAt: +d.updatedAt || 0, sharedAt: +d.sharedAt || null,
      answers,
    };
  }
  function peopleOf(group) {
    const ps = group && group.people && typeof group.people === 'object' ? group.people : {};
    return Object.keys(ps).filter(pid => ps[pid] && typeof ps[pid].name === 'string')
      .map(pid => ({ pid, name: ps[pid].name, app: !!ps[pid].app, at: +ps[pid].at || 0 }))
      .sort((a, b) => a.at - b.at || a.name.localeCompare(b.name));
  }

  /* ---------- helpers ---------- */
  const people = () => peopleOf(S.g && S.g.group);
  const curEv = () => S.g && S.route.eid ? S.g.events[S.route.eid] : null;
  function myPid() {
    const g = S.g, pid = g && g.member && g.member.pid;
    return pid && g.group && g.group.people && g.group.people[pid] ? pid : null;
  }
  const isOwner = () => !!myPid() && S.g.group.ownerPid === myPid();
  const canManage = ev => !!ev && (isOwner() || ev.createdBy === myPid());
  // You fill in your own days, and those of people who take part without the app.
  function canEditFor(pid) { const p = people().find(x => x.pid === pid); return !!p && (pid === myPid() || !p.app); }
  const answerOf = (ev, pid) => ev.answers[pid] || { yes: [], maybe: [], none: false };
  const hasAnswer = a => !!a && (a.yes.length + a.maybe.length > 0 || a.none);
  function stateOf(a, d) { return a.yes.includes(d) ? 'yes' : a.maybe.includes(d) ? 'maybe' : ''; }
  const isMeName = p => nameKey(p.name) === 'jij';
  // Every upcoming day that someone marked, with who can, who maybe and who not.
  function stats(ev, ps) {
    const today = todayIso(), answered = [], pending = [];
    ps.forEach(p => { const a = ev.answers[p.pid]; if (hasAnswer(a)) answered.push(Object.assign({}, p, a)); else pending.push(p); });
    const days = new Set(ev.chosen ? [ev.chosen] : []);
    answered.forEach(p => p.yes.concat(p.maybe).forEach(d => { if (d >= today) days.add(d); }));
    const rows = [...days].sort().map(d => {
      const yes = answered.filter(p => p.yes.includes(d));
      const maybe = answered.filter(p => p.maybe.includes(d));
      const no = answered.filter(p => !p.yes.includes(d) && !p.maybe.includes(d));
      return { d, yes, maybe, no, score: yes.length * 2 + maybe.length };
    });
    const max = Math.max(0, ...rows.map(r => r.score));
    const tops = max > 0 ? rows.filter(r => r.score === max) : [];
    return { rows, tops, byDay: new Map(rows.map(r => [r.d, r])), n: answered.length, total: ps.length, answered, pending };
  }
  const names = list => list.map(p => p.name).join(', ');
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function initials(name) {
    const w = String(name).replace(/^voorbeeld:\s*/i, '').split(/\s+/).filter(Boolean);
    return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase();
  }
  function sheet(d, cls) {
    if (!d) return `<div class="sheet ${cls || ''} empty" aria-hidden="true"><div class="mo">dag</div><div class="dn">?</div><div class="wd">nog open</div></div>`;
    const t = pd(d);
    return `<div class="sheet ${cls || ''}" aria-hidden="true"><div class="mo">${MO[t.getMonth()]}</div><div class="dn">${t.getDate()}</div><div class="wd">${WDL[t.getDay()]}</div></div>`;
  }
  function errText(e) {
    const c = String(e && e.code || '');
    if (c === 'auth/admin-restricted-operation' || c === 'auth/operation-not-allowed') return 'Aanmelden lukte niet: zet "Anonymous" aan bij Authentication in Firebase (README, stap 2).';
    if (c.indexOf('api-key') >= 0) return 'De Firebase-gegevens in config.js kloppen niet (README, stap 4).';
    if (c === 'auth/network-request-failed' || c === 'unavailable' || c === 'deadline-exceeded') return 'Geen verbinding met de database. Controleer je internet en probeer opnieuw.';
    if (c === 'permission-denied') return 'Dat mag niet: je hebt hier geen toegang (meer) toe.';
    if (!c && e && /import|fetch|module/i.test(String(e.message))) return 'De app kon de database niet laden. Controleer je internetverbinding.';
    return 'Er ging iets mis' + (c ? ' (' + c + ')' : '') + '. Probeer het opnieuw.';
  }
  function write(p) { p.catch(e => toast(errText(e))); }

  /* ---------- links and messages ---------- */
  const baseUrl = () => location.href.split('#')[0].split('?')[0];
  function groupLink(eid) {
    const g = S.g;
    if (g.gid === DEMO) return baseUrl() + '#/g/' + DEMO + (eid ? '/e/' + eid : '');
    return baseUrl() + '#/j/' + g.gid + '/' + g.group.invite + (eid ? '/' + eid : '');
  }
  const titleOf = ev => ev.title.trim() || 'Datum prikken';
  function bestLine(st) {
    if (st.tops.length === 1) {
      const b = st.tops[0];
      return `Beste dag tot nu toe: ${shortDate(b.d)} (${b.yes.length} van ${st.n} kunnen${b.maybe.length ? ', ' + b.maybe.length + ' misschien' : ''})`;
    }
    if (st.tops.length > 1) return 'Gelijkstand tussen ' + st.tops.slice(0, 3).map(b => shortDate(b.d)).join(', ') + (st.tops.length > 3 ? ' en nog ' + (st.tops.length - 3) : '');
    return '';
  }
  function groupMsg() {
    return `Doe mee in onze groep *${S.g.group.name}* op Wie kan wanneer. Daar prikken we samen een datum en zie je meteen wie wanneer kan:\n${groupLink()}`;
  }
  function inviteMsg(ev) {
    return '*' + titleOf(ev) + '*\nDuid in de kalender aan wanneer je kan:\n' + groupLink(ev.id);
  }
  function statusMsg(ev) {
    const st = stats(ev, people());
    const lines = ['*' + titleOf(ev) + '*: stand van zaken', bestLine(st)];
    if (st.answered.length) lines.push('Al geantwoord: ' + names(st.answered));
    if (st.pending.length) lines.push('Nog niet: ' + names(st.pending));
    lines.push('', 'Duid aan wanneer je kan: ' + groupLink(ev.id));
    return lines.filter((l, i) => l || i > 1).join('\n');
  }
  function decisionMsg(ev) {
    const d = ev.chosen; if (!d) return '';
    const r = stats(ev, people()).byDay.get(d);
    const lines = ['*' + (ev.title.trim() || 'Afspraak') + '*', `Het wordt ${longDate(d)}!`];
    if (r && r.yes.length) lines.push('Erbij: ' + names(r.yes));
    if (r && r.maybe.length) lines.push('Misschien: ' + names(r.maybe));
    lines.push('', 'Alles bekijken: ' + groupLink(ev.id));
    return lines.join('\n');
  }
  function msgText(key) {
    const g = S.g; if (!g || !g.group) return '';
    if (key === 'group') return groupMsg();
    if (key === 'link') return groupLink();
    const ev = curEv(); if (!ev) return '';
    return key === 'invite' ? inviteMsg(ev) : key === 'status' ? statusMsg(ev) : decisionMsg(ev);
  }
  const waHref = key => 'https://wa.me/?text=' + encodeURIComponent(msgText(key));
  function shareButtons(key, small) {
    const s = small ? ' small' : '';
    return `<div class="row"><button class="btn primary${s}" data-action="copy" data-msg="${key}">Kopieer</button>${navigator.share ? `<button class="btn${s}" data-action="share" data-msg="${key}">Delen…</button>` : ''}<a class="btn${s}" href="${esc(waHref(key))}" target="_blank" rel="noopener" data-action="wa" data-msg="${key}">Open in WhatsApp</a></div>`;
  }

  /* ---------- rendering ---------- */
  // Live updates from others must not interrupt typing: they wait until the field is left.
  let queued = false, dirty = false;
  function typing() {
    const a = document.activeElement;
    return !!(a && app.contains(a) && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type === 'text')));
  }
  function scheduleRender() {
    if (queued) return;
    queued = true;
    Promise.resolve().then(() => { queued = false; if (typing()) dirty = true; else render(); });
  }
  document.addEventListener('click', () => { if (dirty && !typing()) render(); });
  document.addEventListener('focusout', () => setTimeout(() => { if (dirty && !typing() && !document.querySelector(':active')) render(); }, 250));

  function render() {
    dirty = false;
    const ae = document.activeElement;
    const fid = ae && ae.id && app.contains(ae) ? ae.id : null;
    let sel = null;
    if (fid) { try { sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { sel = null; } }
    app.innerHTML = topBar() + banners() + body();
    if (fid) {
      const el = document.getElementById(fid);

  // Opens on the chosen day, else on the earliest day someone can, else this month.
  function calMonth(st) {
    if (!S.calMonth) {
      const first = st.rows.find(r => r.d >= todayIso());
      S.calMonth = monthStart(first ? pd(first.d) : new Date());
    }
    return S.calMonth;
  }
  function calendar(ev, st, pid, who) {
    const a = answerOf(ev, pid), today = todayIso(), m = calMonth(st);
    const y = m.getFullYear(), mo = m.getMonth();
    const lead = (new Date(y, mo, 1).getDay() + 6) % 7;
    const daysIn = new Date(y, mo + 1, 0).getDate();
    const tops = new Set(st.tops.map(t => t.d));
    let cells = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < lead; i++) cells += '<div class="blank"></div>';
    for (let d = 1; d <= daysIn; d++) {
      const dt = new Date(y, mo, d), s = iso(dt), r = st.byDay.get(s);
      const mine = stateOf(a, s), cnt = r ? r.yes.length + r.maybe.length : 0;
      const cls = ['day'];
      if (dt.getDay() === 0 || dt.getDay() === 6) cls.push('we');
      if (s === today) cls.push('today');
      if (mine) cls.push(mine); else if (cnt) cls.push('others');
      if (tops.has(s)) cls.push('best');
      if (ev.chosen === s) cls.push('chosen');
      const label = longDate(s) + ': ' + who + (mine === 'yes' ? ' kan' : mine === 'maybe' ? ' misschien' : ' niet aangeduid')
        + (r ? `. ${r.yes.length} ${r.yes.length === 1 ? 'kan' : 'kunnen'}${r.maybe.length ? ', ' + r.maybe.length + ' misschien' : ''}` : '')
        + (ev.chosen === s ? '. Geprikt' : tops.has(s) ? '. Beste dag' : '');
      cells += `<button class="${cls.join(' ')}" id="cal-${esc(pid)}-${s}" data-action="mark" data-pid="${esc(pid)}" data-d="${s}" ${s < today ? 'disabled' : ''} aria-pressed="${mine ? 'true' : 'false'}" aria-label="${esc(label)}">${d}${cnt ? `<span class="badge">${cnt}</span>` : ''}</button>`;
    }
    const nowMonth = monthStart(new Date());
    const monthName = MOL[mo] + (y !== new Date().getFullYear() ? ' ' + y : '');
    const wd = (n, l) => `<button class="btn small" data-action="bulk" data-pid="${esc(pid)}" data-wd="${n}">${l}</button>`;
    return `<div class="cal">
        <div class="cal-head"><button class="cal-nav" data-action="month" data-dir="-1" aria-label="Vorige maand" ${m <= nowMonth ? 'disabled' : ''}>‹</button><b>${esc(monthName)}</b><button class="cal-nav" data-action="month" data-dir="1" aria-label="Volgende maand">›</button></div>
        <div class="cal-grid">${cells}</div>
        <div class="quick"><span>Snel alle</span>${wd(5, 'vrijdagen')}${wd(6, 'zaterdagen')}${wd(0, 'zondagen')}<span>van ${esc(MOL[mo])}</span></div>
        <div class="legend"><span><i class="y"></i>kan</span><span><i class="m"></i>misschien</span><span><i class="o"></i>anderen kunnen (aantal)</span><span><i class="b"></i>beste dag</span></div>
      </div>`;
  }
  function daysList(a) {
    const today = todayIso();
    const ds = a.yes.concat(a.maybe).filter(d => d >= today).sort();
    return ds.map(d => esc(shortDate(d)) + (a.maybe.includes(d) ? ' (misschien)' : '')).join(', ');
  }

  function myCard(ev, st, mine) {
    const mp = myPid(), a = answerOf(ev, mp), list = daysList(a);
    const sub = mine
      ? 'Bewaard: iedereen in de groep ziet je dagen. Dagen die je niet aanduidt, tellen als "kan niet".'
      : 'Tik de dagen aan waarop je kan. Nog een keer tikken is "misschien", een derde keer haalt de dag weg. Het cijfertje toont hoeveel mensen die dag kunnen.';
    const foot = list
      ? `<p class="mydays"><b>Jouw dagen:</b> ${list}</p>`
      : a.none
        ? '<p class="mydays">Je gaf aan dat je op geen enkele dag kan. Tik een dag aan als dat verandert.</p>'
        : '<div class="row"><button class="linkbtn" data-action="none">Ik kan op geen enkele dag</button></div>';
    return `<div class="card${mine ? '' : ' focus'}" id="mine"><div style="display:grid;gap:4px"><h2>Wanneer kan jij?</h2><p class="muted small">${sub}</p></div>
      ${calendar(ev, st, mp, 'jij')}${foot}</div>`;
  }

  function headline(ev, st) {
    const manage = canManage(ev);
    if (ev.chosen) {
      const r = st.byDay.get(ev.chosen);
      return `<div class="card best">${sheet(ev.chosen, 'big')}<div class="txt"><p class="eyebrow">Geprikt</p><p class="big"><span class="hl">${esc(longDate(ev.chosen))}</span></p>
        <p class="muted">${r ? `${r.yes.length} van ${st.n} kunnen${r.maybe.length ? ', ' + r.maybe.length + ' misschien' : ''}` : ''}</p>
        <div class="row"><button class="btn primary" data-action="copy" data-msg="decision">Kopieer de aankondiging</button>${manage ? '<button class="btn ghost" data-action="unchoose">Andere dag kiezen</button>' : ''}</div></div></div>`;
    }
    const who = manage ? '' : '<p class="muted small">Wie de planning maakte, prikt de definitieve dag.</p>';
    if (st.tops.length === 1) {
      const b = st.tops[0];
      const tail = b.yes.length === st.n ? '. Iedereen kan!' : b.no.length ? '. Kan niet: ' + esc(names(b.no)) : '. Niemand zegt nee.';
      return `<div class="card best">${sheet(b.d, 'big')}<div class="txt"><p class="eyebrow">Beste dag tot nu toe</p><p class="big"><span class="hl">${esc(longDate(b.d))}</span></p>
        <p class="muted">${b.yes.length} van ${st.n} kunnen${b.maybe.length ? ', ' + b.maybe.length + ' misschien' : ''}${tail}</p>
        ${manage ? `<div class="row"><button class="btn primary" data-action="choose" data-d="${b.d}">Prik deze dag</button></div>` : who}</div></div>`;
    }
    if (st.tops.length > 1) {
      const shown = st.tops.slice(0, 3), rest = st.tops.length - shown.length;
      return `<div class="card best">${sheet(null, 'big')}<div class="txt"><p class="eyebrow">Gelijkstand</p><p class="big">${shown.map(b => `<span class="hl">${esc(shortDate(b.d))}</span>`).join(' of ')}${rest ? ` <span class="muted" style="font-size:20px">en nog ${rest}</span>` : ''}</p>
        <p class="muted">Telkens ${st.tops[0].yes.length} van ${st.n} kunnen. Kies er zelf een of wacht op meer antwoorden.</p>
        ${manage ? `<div class="row">${shown.map(b => `<button class="btn" data-action="choose" data-d="${b.d}">Prik ${esc(shortDate(b.d))}</button>`).join('')}</div>` : who}</div></div>`;
    }
    return `<div class="card best">${sheet(null, 'big')}<div class="txt"><p class="eyebrow">Geen overlap</p><p class="big">Nog geen enkele dag past</p><p class="muted">Wie al antwoordde, kan op geen enkele komende dag.</p></div></div>`;
  }

  function rankCard(ev, st) {
    const topSet = new Set(st.tops.map(t => t.d)), n = Math.max(1, st.n), LIMIT = 8;
    let rows = st.rows.slice();
    if (S.sortMode === 'best') rows.sort((a, b) => b.score - a.score || a.d.localeCompare(b.d));
    const more = rows.length > LIMIT;
    if (more && !S.allDays) rows = rows.slice(0, LIMIT);
    const rank = rows.map(r => {
      const t = pd(r.d);
      return `<div class="rank-row ${topSet.has(r.d) ? 'top' : ''}">
        <span class="dl">${WD[t.getDay()]}<span class="dnum">${t.getDate()}</span>${MO[t.getMonth()]}</span>
        <div style="min-width:0"><div class="bar" role="img" aria-label="${r.yes.length} kunnen, ${r.maybe.length} misschien, van ${st.n}"><i class="y" style="width:${r.yes.length / n * 100}%"></i><i class="m" style="width:${r.maybe.length / n * 100}%"></i></div>
          <div class="who">${ev.chosen === r.d ? '<span class="chip-tag" style="margin:0 6px 0 0">Geprikt</span>' : ''}${r.yes.length ? esc(names(r.yes)) : '<span style="color:var(--ink-3)">Niemand zeker</span>'}${r.maybe.length ? ` <span class="mb">· misschien ${esc(names(r.maybe))}</span>` : ''}${r.no.length && r.no.length <= 4 ? ` <span style="color:var(--ink-3)">· niet ${esc(names(r.no))}</span>` : ''}</div></div>
        <span class="score">${r.yes.length}<small>/${st.n}</small>${r.maybe.length ? `<span class="q">+${r.maybe.length} misschien</span>` : ''}</span>
      </div>`;
    }).join('');
    return `<div class="card">
        <div class="row" style="justify-content:space-between"><h2>${S.sortMode === 'best' ? 'Beste dagen' : 'Alle dagen'}</h2>
          <div class="seg" role="group" aria-label="Sorteren"><button data-action="sort" data-s="best" aria-pressed="${S.sortMode === 'best'}">Beste eerst</button><button data-action="sort" data-s="date" aria-pressed="${S.sortMode === 'date'}">Op datum</button></div></div>
        <div class="rank">${rank}</div>
        ${more ? `<div class="row"><button class="linkbtn" data-action="all-days">${S.allDays ? 'Toon minder' : 'Toon alle ' + st.rows.length + ' dagen'}</button></div>` : ''}
        <div class="legend"><span><i class="y"></i>kan</span><span><i class="m"></i>misschien</span></div>
      </div>`;
  }

  function matrixCard(ev, st) {
    const mp = myPid(), topSet = new Set(st.tops.map(t => t.d)), MAX = 10;
    const cols = st.rows.slice().sort((a, b) => b.score - a.score || a.d.localeCompare(b.d)).slice(0, MAX).sort((a, b) => a.d.localeCompare(b.d));
    const head = cols.map(c => { const t = pd(c.d); return `<th class="${topSet.has(c.d) ? 'top-col' : ''}" scope="col"><span class="n">${t.getDate()}</span>${WD[t.getDay()]} ${MO[t.getMonth()]}</th>`; }).join('');
    const rows = st.answered.map(p => {
      const editable = p.pid === mp || !p.app;
      return `<tr class="${p.pid === mp ? 'me' : ''}"><th class="name" scope="row">${esc(p.name)}${p.pid === mp && !isMeName(p) ? '<span class="chip-tag">jij</span>' : ''}${p.app ? '' : '<span class="noapp-tag" title="Iemand anders vulde dit in">zonder app</span>'}</th>${cols.map(c => {
        const s = stateOf(p, c.d);
        const lab = `${p.name}, ${shortDate(c.d)}: ${s === 'yes' ? 'kan' : s === 'maybe' ? 'misschien' : 'kan niet'}`;
        return `<td><button class="cell ${s}" id="c-${esc(p.pid)}-${c.d}" data-action="mark" data-pid="${esc(p.pid)}" data-d="${c.d}" aria-label="${esc(lab)}" ${editable ? '' : 'disabled'}>${s === 'yes' ? '✓' : s === 'maybe' ? '?' : '–'}</button></td>`;
      }).join('')}</tr>`;
    }).join('');
    const foot = cols.map(c => `<td>${c.yes.length}${c.maybe.length ? `<span style="font-size:12px;color:var(--ink-3)">+${c.maybe.length}</span>` : ''}</td>`).join('');
    return `<div class="card">
        <div><h2>Per persoon</h2><p class="muted small">${st.rows.length > MAX ? `De ${MAX} beste dagen. ` : ''}Je eigen rij kan je hier ook aanpassen. Rijen "zonder app" vulde iemand anders in; die kan iedereen aanpassen.</p></div>
        <div class="tablewrap"><table class="grid"><thead><tr><th class="name" scope="col">Naam</th>${head}</tr></thead>
        <tbody>${rows}</tbody><tfoot><tr><th class="name">Kunnen</th>${foot}</tr></tfoot></table></div>
      </div>`;
  }

  function overviewTab(ev, st) {
    const mp = myPid(), mine = hasAnswer(ev.answers[mp]);
    // Until someone else answers, the group probably does not know about this planning yet.
    const nudge = canManage(ev) && !ev.sharedAt && !ev.chosen && !st.answered.some(p => p.pid !== mp)
      ? `<div class="card"><div style="display:grid;gap:4px"><h2>Laat het de groep weten</h2><p class="muted small">De anderen zien deze planning in de app, maar krijgen geen melding. Stuur even een bericht in jullie WhatsApp-groep.</p></div>${shareButtons('invite')}</div>`
      : '';
    const others = st.pending.filter(p => p.pid !== mp);
    const pend = others.length
      ? `<div class="card"><p><b>Nog niet geantwoord</b> <span class="muted">(${others.length})</span><br><span class="muted">${esc(names(others))}</span></p>
          <div class="row"><button class="btn small" data-action="copy" data-msg="status">Kopieer een herinnering</button><a class="btn small" href="${esc(waHref('status'))}" target="_blank" rel="noopener">Herinner via WhatsApp</a></div></div>`
      : '';
    const my = myCard(ev, st, mine);
    if (!st.n) return nudge + my + pend;
    const head = headline(ev, st);
    const more = st.rows.length ? rankCard(ev, st) + matrixCard(ev, st) : '';
    return (mine ? head + nudge + my : nudge + my + head) + pend + more;
  }

  function shareTab(ev, st) {
    const card = (key, title, sub) => `<div class="card msg-card">
      <div style="display:grid;gap:4px"><h2>${title}</h2>${sub ? `<p class="muted small">${sub}</p>` : ''}</div>
      <pre class="msg" id="msg-${key}" tabindex="0">${esc(msgText(key))}</pre>${shareButtons(key)}</div>`;
    let out = card('invite', 'Bericht voor de groep', 'Met de link opent iedereen de kalender van deze planning en tikt zelf aan wanneer het past.');
    if (st.n) out += card('status', 'Herinnering met stand van zaken', 'Handig om nog wat antwoorden los te krijgen.');
    if (ev.chosen) out += card('decision', 'Aankondiging', 'De knoop is doorgehakt.');
    else if (st.n) out += `<div class="card"><p class="muted small">Is er een dag geprikt, dan staat hier ook een kant-en-klare aankondiging.</p></div>`;
    return out;
  }

  function othersTab(ev, st) {
    const ps = people().filter(p => !p.app), pr = S.proxy;
    const sel = pr.pid && ps.find(p => p.pid === pr.pid);
    const a = sel ? answerOf(ev, sel.pid) : null, list = a ? daysList(a) : '';
    return `<div class="card">
        <div style="display:grid;gap:4px"><h2>Voor iemand zonder app</h2>
          <p class="muted small">Antwoordde iemand in de chat of mondeling? Kies die persoon of voeg de naam toe, en tik de dagen voor die persoon aan. Iedereen in de groep ziet het meteen.</p></div>
        ${ps.length ? `<div class="people">${ps.map(p => personChip(p, null, 'proxy-pick', !!sel && sel.pid === p.pid)).join('')}</div>` : ''}
        <div><label class="lbl" for="proxy-name">Iemand toevoegen</label><div class="inrow"><input class="input" id="proxy-name" type="text" maxlength="40" placeholder="bv. Oma" value="${esc(pr.name)}" autocomplete="off"><button class="btn" data-action="proxy-add">Voeg toe</button></div></div>
        ${pr.err ? `<p class="err" role="alert">${esc(pr.err)}</p>` : ''}
      </div>
      ${sel ? `<div class="card focus"><div style="display:grid;gap:4px"><h2>Wanneer kan ${esc(sel.name)}?</h2><p class="muted small">Elke tik wordt meteen bewaard.</p></div>
        ${calendar(ev, st, sel.pid, sel.name)}
        ${list ? `<p class="mydays"><b>Dagen van ${esc(sel.name)}:</b> ${list}</p>` : ''}</div>` : ''}`;
  }

  /* ---------- actions ---------- */
  let toastTimer = null;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2800);
  }
  function selectNode(el) {
    try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }
  function markShared(key) {
    const ev = curEv(), g = S.g;
    if ((key === 'invite' || key === 'status') && ev && !ev.sharedAt) write(api(g.gid).updateEvent(g.gid, ev.id, { sharedAt: Date.now() }));
  }
  function copy(key) {
    const text = msgText(key);
    const done = () => { markShared(key); toast(key === 'link' ? 'Link gekopieerd.' : 'Gekopieerd. Plak het in de groep.'); };
    const fail = () => {
      let el = document.getElementById('msg-' + key);
      if (!el && /^(invite|status|decision)$/.test(key)) { S.tab = 'share'; render(); el = document.getElementById('msg-' + key); }
      if (el) { el.scrollIntoView({ block: 'center' }); selectNode(el); }
      markShared(key);
      toast('Automatisch kopiëren lukte niet. ' + (el ? 'De tekst is geselecteerd: kopieer hem zelf.' : 'Probeer "Open in WhatsApp".'));
    };
    try {
      const p = navigator.clipboard && navigator.clipboard.writeText(text);
      if (p && p.then) p.then(done, fail); else fail();
    } catch (e) { fail(); }
  }

  function parseHash() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } });
    if (parts[0] === 'j' && parts[1] && parts[2]) return { name: 'join', gid: parts[1], code: parts[2], eid: parts[3] || null };
    if (parts[0] === 'nieuw') return { name: 'newgroup' };
    if (parts[0] === 'g' && parts[1]) {
      const gid = parts[1];
      if (parts[2] === 'nieuw') return { name: 'new', gid };
      if (parts[2] === 'instellingen') return { name: 'settings', gid };
      if (parts[2] === 'e' && parts[3]) return { name: parts[4] === 'aanpassen' ? 'edit' : 'event', gid, eid: parts[3] };
      return { name: 'group', gid };
    }
    return { name: 'home' };
  }
  function go(hash, replace) {
    if (location.hash === hash) { onRoute(); return; }
    if (replace) { history.replaceState(null, '', hash); onRoute(); } else location.hash = hash;
  }
  function onRoute() {
    const r = parseHash(), prev = S.route;
    const same = !!prev && prev.name === r.name && prev.gid === r.gid && prev.eid === r.eid;
    S.route = r;
    if (!same) {
      S.confirm = null; S.draftErr = ''; S.draft = null;
      if (r.name !== 'event' || !prev || prev.eid !== r.eid) { S.tab = 'overview'; S.calMonth = null; S.allDays = false; S.proxy = { pid: null, name: '', err: '' }; }
      if (r.name === 'new') S.draft = { eid: null, title: '' };
      if (r.name === 'newgroup') S.ng = { name: '', me: savedName(), err: '', busy: false };
      if (r.name === 'settings') S.set = { me: null, name: null };
      if (r.gid && r.name !== 'join' && (!S.who || S.who.gid !== r.gid)) S.who = { gid: r.gid, name: savedName(), err: '', ask: null, busy: false };
      window.scrollTo(0, 0);
    }
    if (r.name === 'join') { closeGroup(); if (!same) startJoin(r); }
    else if (r.gid) openGroup(r.gid);
    else closeGroup();
    render();
  }

  function createGroup() {
    const f = S.ng; if (!f || f.busy) return;
    const name = f.name.trim().replace(/\s+/g, ' ').slice(0, 60), me = cleanName(f.me).slice(0, 40);
    f.err = !name ? 'Geef de groep een naam.' : !me ? 'Vul je naam in.' : '';
    if (f.err) { render(); return; }
    f.busy = true; render();
    const gid = rid(16), pid = 'p' + rid(9), code = rid(12), now = Date.now();
    firebase()
      .then(() => Remote.createGroup(gid, { name, invite: code, ownerPid: pid, people: { [pid]: { name: me, app: true, at: now } }, createdAt: now, updatedAt: now }, { pid, code, at: now }))
      .then(() => {
        LS.set(K_NAME, me); keepStorage(); remember(gid, name);
        if (S.ng === f) go('#/g/' + gid, true);
      }, e => {
        f.busy = false;
        f.err = e && e.code === 'permission-denied' ? 'De database weigerde de nieuwe groep. Staan de regels uit firestore.rules in Firebase (README, stap 3)?' : errText(e);
        if (S.ng === f) render();
      });
  }

  const joinTarget = j => '#/g/' + j.gid + (j.eid ? '/e/' + j.eid : '');
  function startJoin(r) {
    const j = S.join = { gid: r.gid, code: r.code, eid: r.eid, state: 'checking', name: savedName(), err: '' };
    if (!configured) return;
    firebase().then(() => Remote.getMember(r.gid)).then(m => {
      if (S.join !== j) return;
      if (m) { go(joinTarget(j), true); return; }
      j.state = 'ask'; render();
    }, e => { if (S.join !== j) return; j.state = 'ask'; j.err = errText(e); render(); });
  }
  function doJoin() {
    const j = S.join; if (!j || j.state === 'busy') return;
    const name = cleanName(j.name).slice(0, 40);
    if (!name) { j.err = 'Vul je naam in.'; render(); return; }
    j.state = 'busy'; j.err = ''; render();
    firebase().then(() => Remote.join(j.gid, { pid: null, code: j.code, at: Date.now() })).then(() => {
      if (S.join !== j) return;
      LS.set(K_NAME, name); keepStorage();
      S.pendingName = { gid: j.gid, name };
      go(joinTarget(j), true);
    }, e => {
      if (S.join !== j) return;
      j.state = 'ask';
      j.err = e && e.code === 'permission-denied' ? 'Deze uitnodiging werkt niet (meer). Misschien maakte de beheerder een nieuwe link. Vraag in de groep om de nieuwste link.' : errText(e);
      render();
    });
  }

  // Right after joining: link this device to a name in the group.
  function autoClaim() {
    const g = S.g, pn = S.pendingName;
    if (!pn || !g || pn.gid !== g.gid || !g.group || !g.member || myPid()) return;
    S.pendingName = null;
    S.who = { gid: g.gid, name: pn.name, err: '', ask: null, busy: false };
    claimByName(pn.name);
  }
  function claimByName(raw) {
    const w = S.who, name = cleanName(raw).slice(0, 40);
    if (!name) { w.err = 'Vul je naam in.'; scheduleRender(); return; }
    const match = people().find(p => nameKey(p.name) === nameKey(name));
    if (match && match.app) { w.ask = match.pid; w.err = ''; scheduleRender(); return; }
    claim(match ? match.pid : null, match ? match.name : name);
  }
  function claim(pid, name) {
    const g = S.g, gid = g.gid, a = api(gid), now = Date.now(), w = S.who, p = { updatedAt: now };
    if (pid) p['people.' + pid + '.app'] = true;
    else { pid = 'p' + rid(9); p['people.' + pid] = { name, app: true, at: now }; }
    w.busy = true; w.ask = null; w.err = '';
    LS.set(K_NAME, name);
    Promise.all([a.updateGroup(gid, p), a.updateMember(gid, { pid })])
      .then(() => { w.busy = false; scheduleRender(); }, e => { w.busy = false; w.err = errText(e); scheduleRender(); });
    scheduleRender();
  }

  function putAnswer(ev, pid, a) {
    const g = S.g;
    write(api(g.gid).updateEvent(g.gid, ev.id, { ['answers.' + pid]: { yes: a.yes, maybe: a.maybe, none: !!a.none, at: Date.now() }, updatedAt: Date.now() }));
  }
  // Tap cycle: not marked → kan → misschien → not marked.
  function markDay(ev, pid, d) {
    const a = answerOf(ev, pid), s = stateOf(a, d);
    const yes = a.yes.filter(x => x !== d), maybe = a.maybe.filter(x => x !== d);
    if (s === '') yes.push(d); else if (s === 'yes') maybe.push(d);
    putAnswer(ev, pid, { yes, maybe, none: false });
  }
  // All Fridays (say) of the shown month: marks them, or clears them when all were already marked.
  function bulkMark(ev, pid, wd) {
    const a = answerOf(ev, pid), m = S.calMonth, today = todayIso();
    const days = [];
    for (let d = 1; d <= new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(); d++) {
      const dt = new Date(m.getFullYear(), m.getMonth(), d);
      if (dt.getDay() === wd && iso(dt) >= today) days.push(iso(dt));
    }
    if (!days.length) return;
    const all = days.every(d => a.yes.includes(d));
    const yes = a.yes.filter(d => !days.includes(d)).concat(all ? [] : days);
    putAnswer(ev, pid, { yes, maybe: a.maybe.filter(d => !days.includes(d)), none: false });
  }
  function saveDraft() {
    const dr = S.draft, g = S.g; if (!dr || !g) return;
    const title = dr.title.trim().replace(/\s+/g, ' ').slice(0, 80);
    if (!title) { S.draftErr = 'Geef de planning een naam.'; render(); return; }
    const gid = g.gid, a = api(gid), now = Date.now();
    if (dr.eid) {
      write(a.updateEvent(gid, dr.eid, { title, updatedAt: now }));
      go('#/g/' + gid + '/e/' + dr.eid, true);
    } else {
      const eid = 'e' + rid(11);
      const data = { title, chosen: null, createdBy: myPid(), createdAt: now, updatedAt: now, sharedAt: null, answers: {} };
      g.events[eid] = normEvent(eid, data); // show it right away; the listener confirms
      a.createEvent(gid, eid, data).catch(e => toast(e && e.code === 'permission-denied'
        ? 'De database weigerde de planning. Publiceer de nieuwste firestore.rules in Firebase (README, stap 3).' : errText(e)));
      go('#/g/' + gid + '/e/' + eid, true);
    }
  }
  function addProxy() {
    const pr = S.proxy, name = cleanName(pr.name).slice(0, 40), g = S.g;
    if (!name) { pr.err = 'Vul een naam in.'; render(); return; }
    const p = people().find(x => nameKey(x.name) === nameKey(name));
    if (p && p.app) { pr.err = p.name + ' gebruikt zelf de app en vult de dagen zelf in.'; render(); return; }
    let pid = p && p.pid;
    if (!pid) {
      pid = 'p' + rid(9);
      write(api(g.gid).updateGroup(g.gid, { ['people.' + pid]: { name, app: false, at: Date.now() }, updatedAt: Date.now() }));
    }
    S.proxy = { pid, name: '', err: '' };
    render();
  }
  function leaveOrDelete(kind) {
    const gid = S.g.gid, a = api(gid), name = S.g.group.name;
    closeGroup(); forget(gid);
    go('#/', true);
    (kind === 'delete' ? a.deleteGroup(gid) : a.leave(gid))
      .then(() => toast(kind === 'delete' ? '“' + name + '” verwijderd.' : 'Je hebt “' + name + '” verlaten.'), e => toast(errText(e)));
  }

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || !app.contains(el)) return;
    const a = el.dataset.action, g = S.g, ev = curEv(), gid = g && g.gid;
    switch (a) {
      case 'create-group': createGroup(); break;
      case 'join': doJoin(); break;
      case 'who-go': claimByName(S.who.name); break;
      case 'who-pick': { const p = people().find(x => x.pid === el.dataset.pid); if (!p) break; if (p.app) { S.who.ask = p.pid; render(); } else claim(p.pid, p.name); break; }
      case 'who-yes': { const p = people().find(x => x.pid === S.who.ask); if (p) claim(p.pid, p.name); break; }
      case 'who-no': S.who.ask = null; S.who.name = ''; S.who.err = 'Kies dan een andere naam, bijvoorbeeld met de eerste letter van je achternaam erbij.'; render(); break;
      case 'retry': closeGroup(); if (S.route.gid) openGroup(S.route.gid); render(); break;
      case 'tab': S.tab = el.dataset.tab; S.confirm = null; render(); break;
      case 'sort': S.sortMode = el.dataset.s; render(); break;
      case 'all-days': S.allDays = !S.allDays; render(); break;
      case 'confirm': S.confirm = el.dataset.what; render(); break;
      case 'confirm-no': S.confirm = null; render(); break;
      case 'month': {
        const m = new Date(S.calMonth || monthStart(new Date())); m.setMonth(m.getMonth() + +el.dataset.dir);
        const now = monthStart(new Date());
        S.calMonth = m < now ? now : m; render(); break;
      }
      case 'mark': if (ev && canEditFor(el.dataset.pid)) markDay(ev, el.dataset.pid, el.dataset.d); break;
      case 'bulk': if (ev && canEditFor(el.dataset.pid)) bulkMark(ev, el.dataset.pid, +el.dataset.wd); break;
      case 'none': if (ev && myPid()) putAnswer(ev, myPid(), { yes: [], maybe: [], none: true }); break;
      case 'proxy-pick': S.proxy = { pid: el.dataset.pid, name: '', err: '' }; render(); break;
      case 'proxy-add': addProxy(); break;
      case 'choose': if (canManage(ev)) write(api(gid).updateEvent(gid, ev.id, { chosen: el.dataset.d, updatedAt: Date.now() })); break;
      case 'unchoose': if (canManage(ev)) write(api(gid).updateEvent(gid, ev.id, { chosen: null, updatedAt: Date.now() })); break;
      case 'delete-event-yes': if (canManage(ev)) {
        const t = ev.title;
        write(api(gid).deleteEvent(gid, ev.id));
        go('#/g/' + gid, true);
        toast('“' + (t || 'Planning') + '” verwijderd.');
      } break;
      case 'copy': copy(el.dataset.msg); break;
      case 'wa': markShared(el.dataset.msg); break;
      case 'share': {
        const key = el.dataset.msg;
        try { navigator.share({ text: msgText(key) }).then(() => markShared(key), () => {}); } catch (x) {}
        break;
      }
      case 'save-draft': saveDraft(); break;
      case 'save-me': {
        const pid = myPid(), nm = cleanName(S.set.me != null ? S.set.me : '').slice(0, 40);
        if (S.set.me == null) break;
        if (!nm) { toast('Vul een naam in.'); break; }
        if (people().some(p => p.pid !== pid && nameKey(p.name) === nameKey(nm))) { toast('Er zit al iemand met die naam in de groep.'); break; }
        write(api(gid).updateGroup(gid, { ['people.' + pid + '.name']: nm, updatedAt: Date.now() }));
        LS.set(K_NAME, nm); S.set.me = null; toast('Naam aangepast.');
        break;
      }
      case 'save-gname': {
        if (!isOwner() || S.set.name == null) break;
        const nm = S.set.name.trim().replace(/\s+/g, ' ').slice(0, 60);
        if (!nm) { toast('Geef de groep een naam.'); break; }
        write(api(gid).updateGroup(gid, { name: nm, updatedAt: Date.now() }));
        S.set.name = null; toast('Groepsnaam aangepast.');
        break;
      }
      case 'rm-yes': if (isOwner()) {
        const p = people().find(x => x.pid === el.dataset.pid);
        write(api(gid).removePerson(gid, el.dataset.pid));
        S.confirm = null; render();
        if (p) toast(p.name + ' is uit de groep verwijderd.');
      } break;
      case 'new-invite-yes': if (isOwner()) {
        write(api(gid).updateGroup(gid, { invite: rid(12), updatedAt: Date.now() }));
        S.confirm = null; render(); toast('Nieuwe link gemaakt. De oude werkt niet meer.');
      } break;
      case 'leave-yes': leaveOrDelete('leave'); break;
      case 'delete-group-yes': if (isOwner()) leaveOrDelete('delete'); break;
    }
  });

  app.addEventListener('input', e => {
    const t = e.target, v = t.value;
    switch (t.id) {
      case 'ng-name': if (S.ng) S.ng.name = v; return;
      case 'ng-me': if (S.ng) S.ng.me = v; return;
      case 'join-name': if (S.join) S.join.name = v; return;
      case 'who-name': if (S.who) S.who.name = v; return;
      case 'set-me': if (S.set) S.set.me = v; return;
      case 'set-name': if (S.set) S.set.name = v; return;
      case 'title': if (S.draft) S.draft.title = v; return;
      case 'proxy-name': S.proxy.name = v; S.proxy.err = ''; return;
    }
  });
  const ENTER = { 'ng-name': 'create-group', 'ng-me': 'create-group', 'join-name': 'join', 'who-name': 'who-go', 'set-me': 'save-me', 'set-name': 'save-gname', 'title': 'save-draft', 'proxy-name': 'proxy-add' };
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !ENTER[e.target.id]) return;
    e.preventDefault();
    const b = app.querySelector(`[data-action="${ENTER[e.target.id]}"]`);
    if (b) b.click();
  });

  /* ---------- boot ---------- */
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('online', () => { S.offline = false; render(); });
  window.addEventListener('offline', () => { S.offline = true; render(); });
  onRoute();
  if (configured) firebase().catch(e => { S.error = errText(e); render(); });
})();
</script>
</body>
</html>
