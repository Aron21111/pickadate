<style>
/* Fonts are self-hosted. */
@font-face { font-family: "Hanken Grotesk"; src: url("fonts/hanken-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

/* Layout: one calm column, wall-calendar details (tear-off sheet, condensed day numerals, highlighter on the winning day). */
:root {
  --paper: #F2F3EE;
  --card: #FBFBF8;
  --ink: #17201C;
  --ink-2: #57615C;
  --ink-3: #8A938E;
  --line: #D9DCD3;
  --cobalt: #2445C9;
  --cobalt-soft: #E2E7FA;
  --on-cobalt: #FFFFFF;
  --amber: #D99A12;
  --amber-soft: #FBF0D4;
  --marker: #FFE35A;
  --marker-ink: #1C1A0C;
  --hl: #FFE35A;
  --danger: #B3261E;
  --ok: #1E7A4C;
  --shadow: 0 1px 0 rgba(23, 32, 28, .04), 0 6px 18px -10px rgba(23, 32, 28, .18);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111513; --card: #191E1B; --ink: #E5EAE6; --ink-2: #A2ABA6; --ink-3: #6E7772; --line: #2B322E;
    --cobalt: #8EA3FF; --cobalt-soft: #1F2848; --on-cobalt: #0D1430; --amber: #E6B13F; --amber-soft: #3A2F14;
    --marker: #D8BC2C; --marker-ink: #17150A; --hl: rgba(216, 188, 44, .34); --danger: #F2867E; --ok: #6FD1A0;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111513; --card: #191E1B; --ink: #E5EAE6; --ink-2: #A2ABA6; --ink-3: #6E7772; --line: #2B322E;
  --cobalt: #8EA3FF; --cobalt-soft: #1F2848; --on-cobalt: #0D1430; --amber: #E6B13F; --amber-soft: #3A2F14;
  --marker: #D8BC2C; --marker-ink: #17150A; --hl: rgba(216, 188, 44, .34); --danger: #F2867E; --ok: #6FD1A0;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; color-scheme: light; background: var(--paper); }
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
body {
  margin: 0;
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(20px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}
.foot { display: grid; gap: 10px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 16px; }
.foot .row { gap: 6px 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--cobalt); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: .01em; overflow-wrap: anywhere; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.sheet-mini { width: 30px; height: 32px; border-radius: 5px; background: var(--card); border: 1.5px solid var(--ink); overflow: hidden; display: grid; grid-template-rows: 9px 1fr; }
.sheet-mini::before { content: ""; background: var(--cobalt); }
.sheet-mini span { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1; display: grid; place-items: center; }
.brand b { font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.top .spacer { flex: 1; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--on-cobalt); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; padding: 0 10px; }
.btn.ghost:hover { background: var(--cobalt-soft); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.back { background: none; border: 0; padding: 4px 0; color: var(--ink-2); font-weight: 600; cursor: pointer; justify-self: start; text-decoration: none; }
.back:hover { color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 14px; min-width: 0; }
.card.focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px var(--cobalt-soft), var(--shadow); }
.banner { border-radius: var(--r); padding: 12px 14px; background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); font-size: 14px; }
.banner a { color: inherit; font-weight: 700; }

/* list */
.list-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.events { display: grid; gap: 10px; }
.ev { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; width: 100%; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; text-decoration: none; color: inherit; }
.ev:hover { border-color: var(--ink-3); }
.ev .t { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.ev .m { font-size: 13px; color: var(--ink-2); }
.ev .go { color: var(--ink-3); font-size: 20px; }
.chip-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--cobalt-soft); color: var(--cobalt); vertical-align: 2px; margin-left: 6px; }
.chip-tag.amber { background: var(--amber-soft); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.gicon { width: 52px; height: 52px; border-radius: 12px; background: var(--cobalt-soft); color: var(--cobalt); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 22px; flex: none; }

/* people */
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
button.pchip { cursor: pointer; min-height: 34px; }
button.pchip:hover { border-color: var(--cobalt); }
.pchip.me { border-color: var(--cobalt); }
.av { width: 32px; height: 32px; border-radius: 999px; background: var(--cobalt-soft); color: var(--cobalt); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 15px; flex: none; line-height: 1; }
.av.noapp { background: transparent; border: 1.5px dashed var(--line); color: var(--ink-3); }
.pchip .av { width: 24px; height: 24px; font-size: 12px; }
.mrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }
.mlist > * + * { border-top: 1px solid var(--line); }
.mrow .m { display: block; font-size: 13px; color: var(--ink-2); }
.mrow b { overflow-wrap: anywhere; }
.linkbox { margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; overflow-wrap: anywhere; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; user-select: all; -webkit-user-select: all; }
.inrow { display: flex; gap: 8px; }
.inrow .input { flex: 1; min-width: 0; }

/* tear-off sheet */
.sheet { width: 64px; flex: none; border-radius: 8px; overflow: hidden; background: var(--card); border: 1.5px solid var(--ink); text-align: center; line-height: 1; }
.sheet .mo { background: var(--cobalt); color: var(--on-cobalt); font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 0 3px; }
.sheet .dn { font-family: var(--f-display); font-weight: 700; font-size: 32px; padding: 5px 0 2px; font-variant-numeric: tabular-nums; }
.sheet .wd { font-size: 11px; font-weight: 600; color: var(--ink-2); padding-bottom: 6px; }
.sheet.big { width: 104px; }
.sheet.big .mo { font-size: 15px; padding: 6px 0 5px; }
.sheet.big .dn { font-size: 56px; padding: 8px 0 2px; }
.sheet.big .wd { font-size: 13px; padding-bottom: 10px; }
.sheet.empty .mo { background: var(--line); color: var(--ink-2); }
.sheet.empty .dn { color: var(--ink-3); }

.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.how .step { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.how .num { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1; color: var(--cobalt); }
.how p { font-size: 14px; color: var(--ink-2); }
.how b { color: var(--ink); display: block; }

/* form */
label.lbl { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--paper); }
.input:focus { border-color: var(--cobalt); outline: none; }
textarea.input { min-height: 140px; resize: vertical; font-size: 14px; line-height: 1.45; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; }

/* calendar */
.cal { display: grid; gap: 10px; max-width: 420px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head b { font-family: var(--f-display); font-size: 22px; font-weight: 700; text-transform: capitalize; }
.cal-nav { width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; }
.cal-nav[disabled] { opacity: .35; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.day { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 9px; border: 1.5px solid transparent; background: var(--paper); cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.day:hover:not([disabled]) { border-color: var(--cobalt); }
.day.we { color: var(--ink-2); }
.day.today { border-color: var(--ink); }
.day[disabled] { opacity: .3; cursor: default; }
.day.sel { background: var(--cobalt); color: var(--on-cobalt); }
.day.off { background: var(--paper); color: var(--ink-3); text-decoration: line-through; border-color: var(--line); border-style: dashed; }
.day .badge { position: absolute; top: 2px; right: 4px; font-family: var(--f-body); font-size: 10px; font-weight: 700; opacity: .85; }
.blank { aspect-ratio: 1; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }

.picked { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 999px; background: var(--cobalt-soft); font-size: 14px; font-weight: 600; }
.pick .n { font-family: var(--f-display); font-weight: 700; color: var(--cobalt); }
.pick button { border: 0; background: transparent; width: 24px; height: 24px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-size: 15px; line-height: 1; }
.pick button:hover { background: var(--card); color: var(--ink); }
.pick.off { background: transparent; border: 1px dashed var(--line); color: var(--ink-3); text-decoration: line-through; }

/* event view */
.ev-head { display: grid; gap: 6px; }
.ev-head .meta { color: var(--ink-2); font-size: 14px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); width: fit-content; max-width: 100%; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tab .cnt { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }

/* your own answer */
.avail { display: grid; }
.av-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 8px 0; }
.av-row + .av-row { border-top: 1px solid var(--line); }
.av-row.chosen { background: color-mix(in srgb, var(--hl) 35%, transparent); border-radius: 10px; padding: 8px; }
.av-d { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.av-d .av-n { font-family: var(--f-display); font-weight: 700; font-size: 16px; color: var(--ink-3); min-width: 16px; text-align: center; }
.av-d .dnum { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0 1px; }
.seg3 { display: inline-flex; gap: 2px; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; background: var(--paper); }
.seg3 button { border: 0; background: transparent; min-height: 36px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.seg3 button:hover { color: var(--ink); }
.seg3 button[aria-pressed="true"][data-v="yes"] { background: var(--cobalt); color: var(--on-cobalt); }
.seg3 button[aria-pressed="true"][data-v="maybe"] { background: repeating-linear-gradient(135deg, var(--amber-soft) 0 4px, var(--card) 4px 8px); box-shadow: inset 0 0 0 1.5px var(--amber); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.seg3 button[aria-pressed="true"][data-v="no"] { background: var(--ink); color: var(--paper); }

/* best day */
.best { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.best .txt { display: grid; gap: 6px; min-width: 0; flex: 1 1 220px; }
.best .big { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.05; }
.hl { background: linear-gradient(transparent 48%, var(--hl) 48%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 2px; }

/* ranking */
.rank { display: grid; gap: 2px; }
.rank-row { display: grid; grid-template-columns: 30px 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 10px; }
.rank-row + .rank-row { border-top: 1px solid var(--line); }
.rank-row.top { background: color-mix(in srgb, var(--hl) 40%, transparent); }
.rank-row .n { font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--ink-3); text-align: center; }
.rank-row .dl { font-weight: 600; white-space: nowrap; }
.rank-row .dl .dnum { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0 2px; }
.bar { height: 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; display: flex; }
.bar .y { background: var(--cobalt); }
.bar .m { background: repeating-linear-gradient(135deg, var(--amber) 0 3px, transparent 3px 6px); }
.who { font-size: 13px; color: var(--ink-2); margin-top: 4px; overflow-wrap: anywhere; }
.who .mb { color: color-mix(in srgb, var(--amber) 65%, var(--ink)); }
.score { font-family: var(--f-display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
.score small { font-size: 15px; color: var(--ink-3); font-weight: 600; }
.score .q { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 600; color: color-mix(in srgb, var(--amber) 70%, var(--ink)); margin-top: 3px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }
.legend i.y { background: var(--cobalt); border-color: var(--cobalt); }
.legend i.m { background: repeating-linear-gradient(135deg, var(--amber) 0 2px, transparent 2px 4px); border-color: var(--amber); }

/* matrix */
.tablewrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.grid { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 14px; }
table.grid th, table.grid td { padding: 4px; text-align: center; }
table.grid thead th { font-weight: 600; font-size: 12px; color: var(--ink-2); vertical-align: bottom; white-space: nowrap; }
table.grid thead th .n { display: block; font-family: var(--f-display); font-size: 17px; font-weight: 700; color: var(--ink); }
table.grid th.name { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; min-width: 110px; padding-right: 10px; font-weight: 600; white-space: nowrap; }
table.grid tbody th.name .chip-tag { margin-left: 4px; }
table.grid tbody tr.me th.name { color: var(--cobalt); }
table.grid tbody tr + tr td, table.grid tbody tr + tr th { border-top: 1px solid var(--line); }
table.grid tfoot td, table.grid tfoot th { border-top: 1.5px solid var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; padding-top: 8px; }
table.grid tfoot th { font-family: var(--f-body); font-size: 13px; text-align: left; }
.noapp-tag { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-left: 4px; }
.cell { width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; font-size: 15px; display: inline-grid; place-items: center; color: var(--ink-3); }
.cell.yes { background: var(--cobalt); border-color: var(--cobalt); color: var(--on-cobalt); }
.cell.maybe { background: repeating-linear-gradient(135deg, var(--amber-soft) 0 4px, transparent 4px 8px); border-color: var(--amber); color: color-mix(in srgb, var(--amber) 70%, var(--ink)); }
.cell[disabled] { cursor: default; }
.x { width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 18px; }
.x:hover { background: var(--paper); color: var(--danger); }

<script>
/* ---------- dates ---------- */
const WD = ['zo','ma','di','wo','do','vr','za'];
const WDL = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MO = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MOL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const pad = n => String(n).padStart(2, '0');
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function iso(dt) { return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
function todayIso() { return iso(new Date()); }
function yearSuffix(t) { return t.getFullYear() !== new Date().getFullYear() ? ' ' + t.getFullYear() : ''; }
function shortDate(s) { const t = pd(s); return WD[t.getDay()] + ' ' + t.getDate() + ' ' + MO[t.getMonth()] + yearSuffix(t); }
function longDate(s) { const t = pd(s); return WDL[t.getDay()] + ' ' + t.getDate() + ' ' + MOL[t.getMonth()] + yearSuffix(t); }

/* Options = the numbered days that are still open. Numbers stay fixed once shared. */
function optionsOf(ev) {
  return ev.dates.map((x, i) => ({ n: i + 1, d: x.d, off: !!x.off })).filter(o => !o.off);
}

/* ---------- answer parsing ---------- */
const MAYBE_WORDS = new Set(['?', 'misschien', 'mss', 'misch', 'evt', 'evt.', 'eventueel', 'wss', 'waarschijnlijk', 'twijfel', 'onzeker', 'vermoedelijk', 'misschiens', 'normaal']);
const EXCEPT_WORDS = new Set(['behalve', 'buiten', 'uitgezonderd', 'except', 'zonder']);
const RE_ALL = /\b(alles|allemaal|overal|altijd|elke dag|alle dagen|om het even|maakt niet uit|eender wanneer|eender welke)\b/;
const RE_NONE = /\b(geen enkele|geen enkel|niks|niets|nergens|kan niet|lukt niet|helaas niet|ben er niet|kan er niet)\b/;
const RE_NEG = /\b(niet|geen|nee|neen)\b/;

function parseAnswer(text, opts) {
  const byN = new Map(opts.map(o => [o.n, o.d]));
  let t = ' ' + String(text).toLowerCase().replace(/[\u2019\u2018]/g, "'").replace(/\u00a0/g, ' ') + ' ';
  // times like 19u, 19:30, 20h, 19.30 are not day numbers
  t = t.replace(/\b\d{1,2}[:.]\d{2}\b/g, ' ').replace(/\b\d{1,2}\s?(?:u|h|uur)\b/g, ' ');
  // explicit dates: 14/11, 14/11/2026
  t = t.replace(/(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*\d{2,4})?/g, (m, d, mo) => {
    const o = opts.find(o => { const x = pd(o.d); return x.getDate() === +d && x.getMonth() + 1 === +mo; });
    return o ? ' #' + o.n + ' ' : ' ';
  });
  // 14 nov, 14 november
  t = t.replace(/(\d{1,2})\s*(jan|feb|mrt|maa|apr|mei|jun|jul|aug|sep|okt|nov|dec)[a-z.]*/g, (m, d, mon) => {
    const mi = mon === 'maa' ? 2 : MO.indexOf(mon);
    const o = opts.find(o => { const x = pd(o.d); return x.getDate() === +d && x.getMonth() === mi; });
    return o ? ' #' + o.n + ' ' : ' ';
  });
  // weekday names (singular or plural), unless a date follows right after
  t = t.replace(/\b(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag)(?:en)?\b(?!\s*#\d)/g, (m, w) => {
    const wd = WDL.indexOf(w);
    const ns = opts.filter(o => pd(o.d).getDay() === wd).map(o => '#' + o.n);
    return ns.length ? ' ' + ns.join(' ') + ' ' : ' ';
  });

  const hasAll = RE_ALL.test(t);
  const toks = t.match(/#\d+|\d+\s*(?:-|–|t\/m|tot)\s*\d+|\d+|[,;\n!]|\?|[a-zà-ÿ.]+/g) || [];
  const clauses = [[]];
  const items = [];
  let pendingMaybe = false, adjacent = null, exceptSeen = false;
  for (const tok of toks) {
    if (/^[,;\n!]$/.test(tok) || tok === 'maar') {
      if (pendingMaybe) markClauseMaybe();
      clauses.push([]); adjacent = null; pendingMaybe = false; continue;
    }
    const clause = clauses.length - 1;
    if (/^#?\d/.test(tok)) {
      let ns;
      const r = tok.match(/^(\d+)\s*(?:-|–|t\/m|tot)\s*(\d+)$/);
      if (r) {
        const a = +r[1], b = +r[2];
        ns = [];
        if (a <= b && b - a <= 40) for (let k = a; k <= b; k++) ns.push(k); else ns.push(a, b);
      } else ns = [+tok.replace('#', '')];
      const it = { ns, maybe: pendingMaybe, clause, except: exceptSeen };
      pendingMaybe = false;
      items.push(it); adjacent = it;
      continue;
    }
    clauses[clause].push(tok);
    if (MAYBE_WORDS.has(tok)) {
      // "2?" or "2 misschien" marks that number; "misschien 2" marks the next one
      if (adjacent) adjacent.maybe = true; else pendingMaybe = true;
    } else if (EXCEPT_WORDS.has(tok)) {
      exceptSeen = true;
    }
    adjacent = null;
  }
  if (pendingMaybe) markClauseMaybe();
  function markClauseMaybe() {
    const c = clauses.length - 1;
    const inClause = items.filter(i => i.clause === c);
    if (inClause.length && !inClause.some(i => i.maybe)) inClause.forEach(i => { i.maybe = true; });
  }
  const neg = clauses.map(words => RE_NEG.test(' ' + words.join(' ') + ' '));

  const yes = new Set(), maybe = new Set(), ignored = [];
  if (hasAll) opts.forEach(o => yes.add(o.d));
  let valid = 0;
  for (const it of items) {
    for (const n of it.ns) {
      const d = byN.get(n);
      if (!d) { ignored.push(n); continue; }
      valid++;
      if (it.except || neg[it.clause]) { yes.delete(d); maybe.delete(d); }
      else if (it.maybe) { yes.delete(d); maybe.add(d); }
      else { yes.add(d); maybe.delete(d); }
    }
  }
  const noneWord = RE_NONE.test(t) && !/geen idee/.test(t);
  const recognized = hasAll || valid > 0 || noneWord;
  return { yes: [...yes], maybe: [...maybe], recognized, ignored, none: recognized && !yes.size && !maybe.size };
}

/* ---------- chat paste parsing ---------- */
const RE_BRACKET = /^\[([^\]]*\d[^\]]*)\]\s*([^:]{1,60}?):\s?(.*)$/;
const RE_ANDROID = /^\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4},?\s+\d{1,2}[:.]\d{2}(?:[:.]\d{2})?(?:\s?[ap]\.?\s?m\.?)?\s*[-–]\s*([^:]{1,60}?):\s?(.*)$/i;
const RE_PLAIN = /^([^\d:\s\[][^:]{0,40}?):\s*(.+)$/;

function cleanName(n) {
  return String(n).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').replace(/^~\s*/, '').replace(/\s+/g, ' ').trim();
}
function nameKey(n) { return cleanName(n).toLowerCase(); }

function parsePaste(text, opts) {
  const lines = String(text).replace(/\r/g, '').split('\n')
    .map(l => l.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').trim());
  const structured = lines.some(l => RE_BRACKET.test(l) || RE_ANDROID.test(l));
  const msgs = [], orphans = [];
  for (const l of lines) {
    if (!l) continue;
    let m, name = null, body = null;
    if (structured) {
      if ((m = l.match(RE_BRACKET))) { name = m[2]; body = m[3]; }
      else if ((m = l.match(RE_ANDROID))) { name = m[1]; body = m[2]; }
    } else if ((m = l.match(RE_PLAIN))) { name = m[1]; body = m[2]; }
    if (name !== null) msgs.push({ name: cleanName(name), text: body });
    else if (msgs.length) msgs[msgs.length - 1].text += '\n' + l;
    else orphans.push(l);
  }
  if (!msgs.length && orphans.length) msgs.push({ name: '', text: orphans.join('\n') });

  const people = new Map(), unrecognized = [];
  for (const m of msgs) {
    const r = parseAnswer(m.text, opts);
    if (!r.recognized) { unrecognized.push(m); continue; }
    const key = nameKey(m.name) || '__' + people.size;
    const prev = people.get(key);
    const adds = /\b(ook|nog)\b/.test(m.text.toLowerCase()) || /^\s*(en|\+)\s/.test(m.text.toLowerCase());
    if (prev && adds) {
      const y = new Set(prev.yes), mb = new Set(prev.maybe);
      r.yes.forEach(d => { y.add(d); mb.delete(d); });
      r.maybe.forEach(d => { if (!y.has(d)) mb.add(d); });
      prev.yes = [...y]; prev.maybe = [...mb]; prev.raw.push(m.text);
      prev.ignored = prev.ignored.concat(r.ignored);
    } else {
      people.set(key, { name: m.name, yes: r.yes, maybe: r.maybe, raw: prev ? prev.raw.concat(m.text) : [m.text], ignored: r.ignored, include: true });
    }
  }
  return { rows: [...people.values()], unrecognized };
}
